name: LaundroQR Flutter Android Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-android-apk:
    name: Build Release APK (Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Generate Android platform scaffolding if absent
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org=com.laundroqr
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis & widget tests
        run: |
          flutter analyze
          flutter test

      - name: Build Production APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: laundroqr-resident-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
